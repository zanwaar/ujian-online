basePath: /api
definitions:
  dto.AnswerRequest:
    properties:
      selected_option_key:
        maxLength: 4
        type: string
    required:
    - selected_option_key
    type: object
  dto.AssignPermissionRequest:
    properties:
      permission_name:
        type: string
      role_name:
        type: string
    required:
    - permission_name
    - role_name
    type: object
  dto.AssignRoleRequest:
    properties:
      role:
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  dto.CandidateLoginRequest:
    properties:
      exam_number:
        type: string
      password:
        type: string
    required:
    - exam_number
    - password
    type: object
  dto.CreateAssignmentRequest:
    properties:
      candidate_id:
        type: string
      exam_id:
        type: string
      exam_session_id:
        type: string
    required:
    - candidate_id
    - exam_id
    - exam_session_id
    type: object
  dto.CreateCandidateRequest:
    properties:
      class_name:
        maxLength: 50
        type: string
      exam_number:
        maxLength: 100
        type: string
      gender:
        enum:
        - L
        - P
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
      school:
        maxLength: 100
        type: string
    required:
    - class_name
    - exam_number
    - gender
    - name
    - password
    - school
    type: object
  dto.CreateExamRequest:
    properties:
      code:
        maxLength: 50
        type: string
      description_html:
        type: string
      duration_minutes:
        maximum: 1440
        minimum: 1
        type: integer
      name:
        maxLength: 100
        type: string
      show_result:
        type: boolean
      shuffle_options:
        type: boolean
      shuffle_questions:
        type: boolean
      subject:
        maxLength: 100
        type: string
    required:
    - code
    - description_html
    - duration_minutes
    - name
    - subject
    type: object
  dto.CreateExamSessionRequest:
    properties:
      ends_at:
        type: string
      exam_id:
        type: string
      name:
        maxLength: 50
        type: string
      starts_at:
        type: string
    required:
    - ends_at
    - exam_id
    - name
    - starts_at
    type: object
  dto.CreatePermissionRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.CreateQuestionRequest:
    properties:
      code:
        maxLength: 50
        type: string
      content_html:
        type: string
      display_order:
        type: integer
      exam_version_id:
        type: string
      options:
        items:
          $ref: '#/definitions/dto.QuestionOptionRequest'
        maxItems: 5
        minItems: 2
        type: array
      weight:
        type: number
    required:
    - content_html
    - exam_version_id
    - options
    - weight
    type: object
  dto.CreateRoleRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.QuestionOptionRequest:
    properties:
      content_html:
        type: string
      display_order:
        type: integer
      is_correct:
        type: boolean
      option_key:
        maxLength: 4
        type: string
    required:
    - content_html
    - option_key
    type: object
  dto.ResetPasswordRequest:
    properties:
      code:
        type: string
      email:
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - code
    - email
    - new_password
    type: object
  dto.Setup2FAResponse:
    properties:
      qr_code_url:
        type: string
      secret:
        type: string
    type: object
  dto.UpdateCandidateRequest:
    properties:
      class_name:
        maxLength: 50
        type: string
      gender:
        enum:
        - L
        - P
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
      school:
        maxLength: 100
        type: string
      status:
        enum:
        - active
        - inactive
        - archived
        type: string
    required:
    - class_name
    - gender
    - name
    - school
    type: object
  dto.UpdateExamRequest:
    properties:
      description_html:
        type: string
      duration_minutes:
        maximum: 1440
        minimum: 1
        type: integer
      name:
        maxLength: 100
        type: string
      show_result:
        type: boolean
      shuffle_options:
        type: boolean
      shuffle_questions:
        type: boolean
      status:
        enum:
        - draft
        - published
        - archived
        type: string
      subject:
        maxLength: 100
        type: string
    required:
    - description_html
    - duration_minutes
    - name
    - subject
    type: object
  dto.UpdateExamSessionRequest:
    properties:
      ends_at:
        type: string
      name:
        maxLength: 50
        type: string
      starts_at:
        type: string
      status:
        enum:
        - scheduled
        - open
        - closed
        - archived
        type: string
    required:
    - ends_at
    - name
    - starts_at
    type: object
  dto.UpdateQuestionRequest:
    properties:
      code:
        maxLength: 50
        type: string
      content_html:
        type: string
      display_order:
        type: integer
      options:
        items:
          $ref: '#/definitions/dto.QuestionOptionRequest'
        maxItems: 5
        minItems: 2
        type: array
      status:
        enum:
        - active
        - archived
        type: string
      weight:
        type: number
    required:
    - content_html
    - options
    - weight
    type: object
  dto.UserLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      two_fa_code:
        type: string
    required:
    - email
    - password
    type: object
  dto.UserRegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      is_two_fa_enabled:
        type: boolean
      name:
        type: string
      token:
        type: string
    type: object
  dto.Verify2FARequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  dto.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  utils.Pagination:
    properties:
      current_page:
        type: integer
      from:
        type: integer
      has_more_pages:
        type: boolean
      last_page:
        type: integer
      per_page:
        type: integer
      to:
        type: integer
      total:
        type: integer
    type: object
  utils.PaginationResult:
    properties:
      items: {}
      pagination:
        $ref: '#/definitions/utils.Pagination'
    type: object
  utils.Response:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a sample server for Golang Backend.
  title: Golang Backend API
  version: "1.0"
paths:
  /2fa/setup:
    post:
      consumes:
      - application/json
      description: Generate 2FA secret and QR code
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.Setup2FAResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Setup 2FA
      tags:
      - auth
  /2fa/verify:
    post:
      consumes:
      - application/json
      description: Verify 2FA code and enable 2FA
      parameters:
      - description: Verification Code
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Verify 2FA
      tags:
      - auth
  /admin/assign-permission:
    post:
      consumes:
      - application/json
      description: Assign a permission to a role (Admin only)
      parameters:
      - description: Assignment Data
        in: body
        name: assignment
        required: true
        schema:
          $ref: '#/definitions/dto.AssignPermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Assign a permission to a role
      tags:
      - Roles
  /admin/assign-role:
    post:
      consumes:
      - application/json
      description: Assign a role to a user (Admin only)
      parameters:
      - description: Assignment Data
        in: body
        name: assignment
        required: true
        schema:
          $ref: '#/definitions/dto.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Assign a role to a user
      tags:
      - Roles
  /admin/permissions:
    post:
      consumes:
      - application/json
      description: Create a new permission (Admin only)
      parameters:
      - description: Permission Data
        in: body
        name: permission
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Create a new permission
      tags:
      - Roles
  /admin/roles:
    post:
      consumes:
      - application/json
      description: Create a new role (Admin only)
      parameters:
      - description: Role Data
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Create a new role
      tags:
      - Roles
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Send reset password code to email
      parameters:
      - description: Email
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Forgot Password
      tags:
      - auth
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login Credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    token:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Login User
      tags:
      - auth
  /me:
    get:
      consumes:
      - application/json
      description: Get details of the currently logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get Current User
      tags:
      - user
  /register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Register Data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UserRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Register User
      tags:
      - auth
  /resend-reset-code:
    post:
      consumes:
      - application/json
      description: Resend reset password code
      parameters:
      - description: Email
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Resend Reset Password Code
      tags:
      - auth
  /resend-verification:
    post:
      consumes:
      - application/json
      description: Resend email verification code
      parameters:
      - description: Email
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Resend Verification Code
      tags:
      - auth
  /reset-password:
    post:
      consumes:
      - application/json
      description: Reset password with code
      parameters:
      - description: Reset Data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Reset Password
      tags:
      - auth
  /users:
    get:
      consumes:
      - application/json
      description: Get paginated list of users with search and filter
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 15
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      - description: Filter by verification status
        in: query
        name: is_verified
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.PaginationResult'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get Users
      tags:
      - user
  /v1/admin/assignments:
    get:
      parameters:
      - description: Candidate ID
        in: query
        name: candidate_id
        type: string
      - description: Exam ID
        in: query
        name: exam_id
        type: string
      - description: Exam session ID
        in: query
        name: exam_session_id
        type: string
      - description: Assignment status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List assignments
      tags:
      - admin-assignments
    post:
      consumes:
      - application/json
      parameters:
      - description: Assignment data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAssignmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Create assignment
      tags:
      - admin-assignments
  /v1/admin/assignments/{id}:
    delete:
      parameters:
      - description: Assignment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Archive assignment
      tags:
      - admin-assignments
    get:
      parameters:
      - description: Assignment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get assignment
      tags:
      - admin-assignments
  /v1/admin/candidates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List candidates
      tags:
      - admin-candidates
    post:
      consumes:
      - application/json
      parameters:
      - description: Candidate data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCandidateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Create candidate
      tags:
      - admin-candidates
  /v1/admin/candidates/{id}:
    delete:
      parameters:
      - description: Candidate ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Archive candidate
      tags:
      - admin-candidates
    get:
      parameters:
      - description: Candidate ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get candidate
      tags:
      - admin-candidates
    put:
      consumes:
      - application/json
      parameters:
      - description: Candidate ID
        in: path
        name: id
        required: true
        type: string
      - description: Candidate data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCandidateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Update candidate
      tags:
      - admin-candidates
  /v1/admin/exams:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List exams
      tags:
      - admin-exams
    post:
      consumes:
      - application/json
      parameters:
      - description: Exam data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateExamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Create exam
      tags:
      - admin-exams
  /v1/admin/exams/{id}:
    delete:
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Archive exam
      tags:
      - admin-exams
    get:
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get exam
      tags:
      - admin-exams
    put:
      consumes:
      - application/json
      parameters:
      - description: Exam ID
        in: path
        name: id
        required: true
        type: string
      - description: Exam data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateExamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Update exam
      tags:
      - admin-exams
  /v1/admin/questions:
    get:
      parameters:
      - description: Exam version ID
        in: query
        name: exam_version_id
        type: string
      - description: Search term
        in: query
        name: search
        type: string
      - description: Question status
        in: query
